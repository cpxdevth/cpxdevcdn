<svg class='loader' width="100" height="100" version="1.1" viewBox="-4 -1 38 28" xmlns="http://www.w3.org/2000/svg">
<style>
  .loader {  
    position:fixed;
    top:0;
    left:0;
    bottom:0;
    right:0;
    margin:auto;
      animation:hue 2s linear infinite;
  }

  svg polygon {
    stroke-dasharray: 0 59 0;
    animation: dashoffset 1.8s ease infinite;
  }

  @keyframes dashoffset {
    to {
      stroke-dashoffset: -118;
    }
  }
  @keyframes hue {
    100% {filter:hue-rotate(360deg); }
  }

</style>
  <polygon cx="40" cy="40" r="15" fill="transparent" stroke="#f71" stroke-width="3" stroke-linecap="round" points="0,0 25,15 0,30"></polygon>
</svg>



